<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест Технополис Москва</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root{
            --corporate-primary: #0066cc;
            --corporate-secondary: #004499;
            --corporate-accent: #3399ff;
            --corporate-gradient-primary: linear-gradient(135deg, var(--corporate-primary) 0%, var(--corporate-secondary) 100%);
            --corporate-gradient-accent: linear-gradient(135deg, var(--corporate-accent) 0%, #00cc66 100%);
            --corporate-gradient-hero: linear-gradient(135deg, var(--corporate-primary) 0%, var(--corporate-secondary) 50%, #6633cc 100%);
            --neutral-bg: #f8f9fa;
        }
        
        .corporate-section-dark {
            background: var(--corporate-gradient-hero);
            color: white;
            padding: 4rem 0;
        }
        
        .corporate-icon {
            width: 4rem;
            height: 4rem;
            background: var(--corporate-gradient-primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            margin: 0 auto 1rem;
        }
        
        .corporate-badge {
            background: var(--corporate-gradient-primary);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
        }
        
        .btn-corporate {
            background: var(--corporate-gradient-primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(0,102,204,0.3);
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-corporate:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,102,204,0.4);
            color: white;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        
        .float-animation {
            animation: float 6s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <!-- Hero Section -->
    <section class="corporate-section-dark" style="min-height: 100vh; display: flex; align-items: center; position: relative; overflow: hidden;">
        <!-- Фоновые элементы -->
        <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 20px 20px;"></div>
        
        <!-- Плавающие иконки -->
        <div class="corporate-icon float-animation" style="position: absolute; top: 20%; left: 10%;">
            <i class="fas fa-code"></i>
        </div>
        <div class="corporate-icon float-animation" style="position: absolute; top: 30%; right: 15%; animation-delay: 1s;">
            <i class="fas fa-database"></i>
        </div>
        <div class="corporate-icon float-animation" style="position: absolute; top: 60%; left: 20%; animation-delay: 2s;">
            <i class="fas fa-cloud"></i>
        </div>
        <div class="corporate-icon float-animation" style="position: absolute; top: 70%; right: 10%; animation-delay: 3s;">
            <i class="fas fa-mobile-alt"></i>
        </div>
        
        <!-- Основной контент -->
        <div style="position: relative; z-index: 10; width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 2rem;">
            <div style="text-align: center; max-width: 48rem; margin: 0 auto;">
                <!-- Заголовок организации -->
                <div style="margin-bottom: 2rem;">
                    <h2 style="font-size: 2rem; font-weight: bold; color: white; margin-bottom: 1rem;">ТЕХНОПОЛИС МОСКВА</h2>
                    <div class="corporate-badge" style="margin-top: 1rem;">
                        <i class="fas fa-star" style="margin-right: 0.5rem;"></i>
                        Твой помощник в поиске работы
                    </div>
                </div>

                <!-- Основной заголовок -->
                <h1 style="font-size: 3.5rem; font-weight: 800; line-height: 1.1; margin-bottom: 2rem; color: white;">
                    Карьера в инновационном <span style="background: var(--corporate-gradient-accent); background-size: 200% auto; animation: gradient-move 4s ease infinite; -webkit-background-clip: text; -webkit-text-fill-color: transparent;">кластере</span>
                </h1>

                <!-- Описание -->
                <p style="font-size: 1.25rem; color: rgba(255,255,255,0.9); margin-bottom: 2rem;">
                    Платформа для поиска вакансий и стажировок в ОЭЗ «Технополис Москва»
                </p>

                <!-- Кнопка действия -->
                <div style="display: flex; flex-direction: column; align-items: center; gap: 1rem; margin-bottom: 2rem;">
                    <a href="/catalog/vacancies/" class="btn-corporate" style="padding: 0.75rem 1.5rem; border-radius: 9999px;">
                        <i class="fas fa-briefcase" style="margin-right: 0.5rem;"></i>
                        Найти вакансию
                    </a>
                </div>
            </div>
        </div>
        
        <!-- Волна внизу -->
        <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 120px;">
            <svg viewBox="0 0 1440 120" fill="none" xmlns="http://www.w3.org/2000/svg" style="display: block; width: 100%; height: 120px;">
                <path d="M0 120L60 105C120 90 240 60 360 45C480 30 600 30 720 37.5C840 45 960 60 1080 67.5C1200 75 1320 75 1380 75L1440 75V120H1380C1320 120 1200 120 1080 120C960 120 840 120 720 120C600 120 480 120 360 120C240 120 120 120 60 120H0Z" fill="var(--neutral-bg)"/>
            </svg>
        </div>
    </section>
</body>
</html>
